name: 部署到 GitHub Pages

# 为什么不用 "Deploy from a branch"：仓库根目录是源代码（开发版 index.html），
# 真正要部署的是构建产物 dist/ —— 而 dist 不进仓库（构建产物不该提交）。
# 所以让 Actions 在每次推送后自己构建、自己发布。Pages 的 Source 要选 "GitHub Actions"。

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 页面可以手动点

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: 构建
        env:
          # 站点部署在这个子路径下，sitemap / og:url 要用真实域名，不能用占位符
          SITE_ORIGIN: https://laowang-ai-xbb.github.io/HowToCheckup
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 自愈岗：万一 Pages 的 Source 还停在 "Deploy from a branch"，
  # 每次 push 会同时跑一个旧的"pages build and deployment"（部署源代码根目录），
  # 和这里的 artifact 部署互相覆盖 —— 谁后完成谁上线，线上就会间歇性白屏。
  # 这个 job 部署完轮询线上页面：发现源代码特征（引用 /src/main.js）就重触发一次本工作流。
  # 注意：手动触发（workflow_dispatch）的运行不走这个自愈，避免无限循环。
  # 根修仍然是：仓库 Settings → Pages → Source 选 "GitHub Actions"。
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      actions: write # 只有重触发工作流需要它
    steps:
      - name: 验证线上是构建产物，被覆盖就自愈重部署
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="https://laowang-ai-xbb.github.io/HowToCheckup/"
          BAD='/src/main.js'
          for i in $(seq 1 20); do
            sleep 15
            # 带随机参数绕过 CDN 缓存，保证拿到的是刚发布的版本
            HTML=$(curl -fsSL "$URL?verify=$GITHUB_RUN_ID-$RANDOM" || true)
            if [ -z "$HTML" ]; then echo "第 $i 次：拉取失败，继续等"; continue; fi
            if echo "$HTML" | grep -qF "$BAD"; then
              echo "线上仍是源代码版（Pages 旧部署覆盖了 artifact），触发自愈重部署"
              gh workflow run deploy-pages.yml --ref main
              exit 0
            fi
            if echo "$HTML" | grep -qE 'assets/main-'; then
              echo "线上是构建产物，验收通过（第 $i 次轮询）"
              exit 0
            fi
            echo "第 $i 次：既没看到源代码特征也没看到构建产物，继续等"
          done
          echo "::warning::轮询 5 分钟仍未确认构建产物上线，请到 Actions 页面手动重跑本工作流"
          exit 1
