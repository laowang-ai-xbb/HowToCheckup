<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="robots" content="noindex" />
    <title>页面没找到 · 长命百岁体检项目指南</title>
    <!--
      这里刻意不引外部样式表。
      静态托管对 /a/b/c 这种子路径返回 404.html 时，相对路径的资源会去 /a/b/ 下找，
      结果是一张没有任何样式的裸 HTML。404 是"最后一屏"，它必须自己站得住。
    -->
    <style>
      :root { --ink:#1b1a17; --ink-2:#5c5850; --ink-3:#6f6a5f; --paper:#f7f4ee; --line:#e4dfd4; --teal:#0f766e; }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--paper); color: var(--ink);
        font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        font-size: 17px; line-height: 1.62; -webkit-text-size-adjust: 100%;
      }
      .screen {
        max-width: 560px; margin: 0 auto; padding: 48px 20px 64px;
        padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px));
      }
      .brand { display: flex; flex-direction: column; gap: 1px; margin-bottom: 30px; }
      .brand-mark { font-size: 12px; letter-spacing: .34em; color: var(--ink-3); font-weight: 600; }
      .brand-name { font-weight: 700; font-size: 19px; color: var(--teal); letter-spacing: .02em; }
      h1 { font-size: 29px; line-height: 1.34; margin: 0 0 16px; letter-spacing: -.01em; }
      h1 em { font-style: normal; color: var(--teal); }
      .lede { font-size: 16.5px; color: var(--ink-2); margin: 0 0 24px; }
      .btn {
        display: block; width: 100%; min-height: 56px; padding: 15px 18px; border-radius: 14px;
        background: var(--teal); color: #fff; font-size: 17px; font-weight: 600;
        text-align: center; text-decoration: none;
      }
      .foot { font-size: 13.5px; color: var(--ink-3); line-height: 1.75; margin-top: 26px; }
    </style>
  </head>
  <body>
    <main class="screen">
      <div class="brand">
        <span class="brand-mark">长命百岁</span>
        <span class="brand-name">体检项目指南</span>
      </div>
      <h1>这个页面不存在，<br /><em>仙人你是怎么闯进这里的</em></h1>
      <p class="lede">赶紧离开，不然我打 110 了。<br />（开玩笑的。回首页吧，那里能用。）</p>
      <a class="btn" href="/" id="home">回首页</a>
      <p class="foot">
        如果你是从家人发来的链接点进来的，说明链接在转发时被截断了。让对方重新点一次「复制分享给家人」，把整段文字一起发过来。
      </p>
    </main>
    <script>
      // 部署在根域名时 "/" 就对了；若部署在子目录（如 /tijian/），
      // 下面这行会把它修正到子目录的根。gen-site-files 以后可以改成构建期注入。
      (function () {
        var seg = location.pathname.split('/').filter(Boolean);
        if (seg.length > 1) document.getElementById('home').href = '/' + seg[0] + '/';
      })();
    </script>
  </body>
</html>
